
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: aadarsh0124/skillio-backend:${IMAGE_TAG:-latest}
    container_name: skillio-backend-compose
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const net = require('net'); const s = net.connect(3000, '127.0.0.1'); s.on('connect', () => { s.end(); process.exit(0); }); s.on('error', () => process.exit(1)); setTimeout(() => process.exit(1), 2000);"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: aadarsh0124/skillio-frontend:${IMAGE_TAG:-latest}
    container_name: skillio-frontend-compose
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
