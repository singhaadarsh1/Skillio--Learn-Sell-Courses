name: Deploy Skillio to EC2

on:
  workflow_run:
    workflows: ["Skillio CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: skillio-ec2-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS EC2
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    runs-on: ubuntu-latest

    steps:
      
      - name: Inspect OIDC claims
        shell: bash
        run: |
          set -e

          TOKEN=$(curl -fsS \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -er '.value')

          if [ -z "$TOKEN" ]; then
            echo "ERROR: OIDC token is empty"
            exit 1
          fi

          PAYLOAD_B64=$(printf '%s' "$TOKEN" | cut -d '.' -f 2 | tr '_-' '/+')

          case $((${#PAYLOAD_B64} % 4)) in
            2) PAYLOAD_B64="${PAYLOAD_B64}==" ;;
            3) PAYLOAD_B64="${PAYLOAD_B64}=" ;;
            1)
              echo "ERROR: Invalid Base64 payload length"
              exit 1
              ;;
          esac

          PAYLOAD=$(printf '%s' "$PAYLOAD_B64" | base64 -d)

          echo "$PAYLOAD" | jq -e '{
            sub,
            aud,
            ref,
            repository_id,
            repository_owner_id,
            event_name
          }'

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: eu-north-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy application through AWS Systems Manager
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_SCRIPT=$(cat <<'EOF'
          set -eu

          cd /home/ubuntu/Skillio--Learn-Sell-Courses

          echo "Checking Git working tree..."

          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "ERROR: Tracked local changes detected."
            exit 1
          fi

          echo "Fetching latest code..."
          git fetch origin main

          echo "Updating repository..."
          git merge --ff-only origin/main

          echo "Installing backend dependencies..."
          npm ci --omit=dev

          echo "Restarting backend..."
          pm2 restart skillio-backend

          echo "Checking PM2..."
          pm2 status skillio-backend

          echo "Deployment completed."
          EOF
          )

          ENCODED_SCRIPT=$(printf '%s' "$DEPLOY_SCRIPT" | base64 -w 0)

          SSM_COMMAND="echo '$ENCODED_SCRIPT' | base64 -d | sudo -iu ubuntu bash"

          PARAMETERS=$(jq -n --arg command "$SSM_COMMAND" \
            '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-025e105b40d4bd7b9" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-025e105b40d4bd7b9"; then

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-025e105b40d4bd7b9" \
              --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
              --output json

            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-025e105b40d4bd7b9" \
            --query "StandardOutputContent" \
            --output text
