name: Deploy Skillio to EC2

on:
  workflow_run:
    workflows: ["Skillio CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: skillio-ec2-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS EC2
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: eu-north-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy application through AWS Systems Manager
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_SCRIPT=$(cat <<'EOF'
          sudo -iu ubuntu bash -lc '
          set -eu

          cd /home/ubuntu/Skillio--Learn-Sell-Courses

          echo "Checking Git working tree..."

          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "ERROR: Tracked local changes detected."
            exit 1
          fi

          echo "Fetching latest code..."
          git fetch origin main

          echo "Updating repository..."
          git merge --ff-only origin/main

          echo "Installing backend dependencies..."
          npm ci --omit=dev

          echo "Restarting backend..."
          pm2 restart skillio-backend

          echo "Checking PM2..."
          pm2 status skillio-backend

          echo "Deployment completed."
          '
          EOF
          )

          PARAMETERS=$(jq -n --arg script "$DEPLOY_SCRIPT" \
            '{commands: [$script]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-025e105b40d4bd7b9" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-025e105b40d4bd7b9"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-025e105b40d4bd7b9" \
            --query "StandardOutputContent" \
            --output text
