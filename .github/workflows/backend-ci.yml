name: Skillio Backend CI

'on':
push:
workflow_dispatch:

jobs:
check-backend:
runs-on: ubuntu-latest


steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22

  - name: Install backend dependencies
    run: npm ci

